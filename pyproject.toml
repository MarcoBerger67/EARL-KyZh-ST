[project]
name = "earl-kyzh-st"
version = "0.1.0"
description = "Entity-aware reinforcement learning for low-resource Kyrgyz-Chinese speech translation."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py310"

